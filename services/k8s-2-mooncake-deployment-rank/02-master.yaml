apiVersion: v1
kind: Service
metadata:
  name: mooncake-master
  namespace: ${MOONCAKE_NAMESPACE}
  labels:
    app: mooncake-master
spec:
  clusterIP: None
  selector:
    app: mooncake-master
  ports:
    - name: master-rpc
      port: 17701
      targetPort: 17701
      protocol: TCP
    - name: master-control
      port: 17702
      targetPort: 17702
      protocol: TCP
    - name: master-metrics
      port: 17703
      targetPort: 17703
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master
  namespace: ${MOONCAKE_NAMESPACE}
  labels:
    app: mooncake-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
        role: master
    spec:
      hostNetwork: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: master
          image: ${MOONCAKE_IMAGE}
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              echo "--- Starting Mooncake Master ---"
              exec /home/mooncake/scripts/k8s-run_mooncake_store_master_ha.sh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MOONCAKE_NAMESPACE
              value: "${MOONCAKE_NAMESPACE}"
          ports:
            - name: master-rpc
              containerPort: 17701
              protocol: TCP
            - name: master-control
              containerPort: 17702
              protocol: TCP
            - name: master-metrics
              containerPort: 17703
              protocol: TCP
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
              unifiedbus.com/ub_net_device: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              unifiedbus.com/ub_net_device: "1"
          startupProbe:
            tcpSocket:
              port: 17701
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 17701
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 17701
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: host-ping
              mountPath: /usr/sbin/ping
              readOnly: true
            - name: mooncake-logs
              mountPath: /var/log/mooncake/master
            - name: startup-scripts
              mountPath: /home/mooncake/scripts
              readOnly: true
      volumes:
        - name: host-ping
          hostPath:
            path: /usr/sbin/ping
            type: File
        - name: mooncake-logs
          hostPath:
            path: ${MOONCAKE_LOG_PATH}/master
            type: DirectoryOrCreate
        - name: startup-scripts
          configMap:
            name: mooncake-startup-scripts
            defaultMode: 0755
