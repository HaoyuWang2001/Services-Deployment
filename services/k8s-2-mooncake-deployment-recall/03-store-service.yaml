apiVersion: v1
kind: Service
metadata:
  name: mooncake-store
  namespace: ${MOONCAKE_NAMESPACE}
  labels:
    app: mooncake-store
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mooncake-store
  ports:
    - name: store
      port: 17704
      targetPort: 17704
      protocol: TCP
