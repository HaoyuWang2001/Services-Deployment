apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: memory-pressure-numa0
  labels:
    app: memory-pressure
    numa: "0"
spec:
  selector:
    matchLabels:
      app: memory-pressure
      numa: "0"
  template:
    metadata:
      labels:
        app: memory-pressure
        numa: "0"
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: memory-pressure
          image: docker.io/library/memory-pressure:latest
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -c
            - exec numactl -N 0 -m 0 /home/stream_bandwidth 0 10 1 140
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 16Gi
          terminationMessagePolicy: File
          volumeMounts:
            - name: stream-bandwidth
              mountPath: /home/stream_bandwidth
              readOnly: true
      volumes:
        - name: stream-bandwidth
          hostPath:
            path: /home/w00921547/downloads/stream_bandwidth
            type: File

